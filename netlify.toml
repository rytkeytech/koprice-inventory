# Netlify build settings. Netlify detects Next.js and adds its runtime
# automatically. Environment variables (Supabase URL and publishable key)
# are set in the Netlify dashboard, never in this file.
[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "24"
  NEXT_TELEMETRY_DISABLED = "1"
