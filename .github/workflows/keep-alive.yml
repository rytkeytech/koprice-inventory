# Free Supabase projects pause after a week without activity. This runs one
# tiny read-only query every day so the shop's database never pauses
# (for example during holidays when nobody sells).
#
# Needs the repository secret SUPABASE_DB_URL (same one as the backup).
name: Keep database awake

on:
  schedule:
    - cron: "0 6 * * *" # every day at 06:00 UTC
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run a read-only query
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then echo "::error::Secret SUPABASE_DB_URL is not set"; exit 1; fi
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -tAc "select count(*) from public.categories" > /dev/null
          echo "Database is awake."
